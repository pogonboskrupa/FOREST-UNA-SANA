plugins {
    id 'com.android.application'
}

android {
    namespace 'ba.spd.usf.forest'
    compileSdk 34

    defaultConfig {
        applicationId "ba.spd.usf.forest"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "0.17.0"
    }

    // Koristi ISKLJUČIVO postojeći release ključ; nikad ne generiši zamjenski.
    def releaseStore = System.getenv('USF_KEYSTORE')
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('USF_STORE_PASSWORD')
                keyAlias System.getenv('USF_KEY_ALIAS')
                keyPassword System.getenv('USF_KEY_PASSWORD')
            }
        }
        // FIKSAN debug ključ, commit-ovan u repo (unasanaforest-debug.keystore).
        // Android dozvoljava update APK-a PREKO postojećeg SAMO ako je potpis
        // ISTI. Podrazumijevani AGP debug ključ se generiše po MAŠINI, pa bi na
        // CI runneru svaki build imao nov potpis i auto-update (UpdateBridge)
        // bi padao na "App not installed" bez objašnjenja korisniku.
        debug {
            storeFile file('unasanaforest-debug.keystore')
            storePassword 'unasanaforest'
            keyAlias 'unasanaforest-debug'
            keyPassword 'unasanaforest'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        noCompress "html", "js", "css", "json", "png", "svg", "kml", "geojson", "wasm"
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation('androidx.core:core:1.12.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.webkit:webkit:1.10.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// Nikad ne prijavi nepotpisan release kao spreman APK za korisnika.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }) {
        ['USF_KEYSTORE', 'USF_STORE_PASSWORD', 'USF_KEY_ALIAS', 'USF_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Nedostaje release konfiguracija: " + it)
        }
    }
}
