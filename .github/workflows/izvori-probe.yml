name: Izvori probe (FGU ortofoto)

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-pasteur-p2npth]
    paths: ['.github/workflows/izvori-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IPP FBiH metapodaci (geonetwork) — ortofoto zapisi
        run: |
          set -u
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          M=https://metapodaci.ippfbih.gov.ba/srv/api/records
          for id in 5ac8d589-7f20-42be-8e90-fea355f247ac 47680f70-6dbc-4781-92ed-cd875a2f9007; do
            echo "=================== $id"
            curl -sSL -m 40 -A "$UA" -H 'Accept: application/xml' "$M/$id/formatters/xml" -o "md_$id.xml" -w 'HTTP %{http_code} %{size_download}B\n' || true
            python3 - "md_$id.xml" <<'PY'
          import sys, re, html
          t = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          if 'Just a moment' in t: print('CLOUDFLARE'); sys.exit()
          for u in sorted(set(re.findall(r'https?://[^\s"<>\x27]+', t))): print('URL', html.unescape(u))
          for tag in ['title','abstract','protocol','name','description','useLimitation','otherConstraints','accessConstraints','beginPosition','endPosition','distance','denominator','dateStamp']:
              for m in re.findall(r'<[a-z]+:%s[^>]*>\s*(?:<[^>]+>)?\s*([^<]{1,400})' % tag, t)[:6]: print(tag.upper(), m.strip())
          PY
          done
          echo "=================== pretraga ortofoto"
          curl -sSL -m 40 -A "$UA" "https://metapodaci.ippfbih.gov.ba/srv/eng/q?any=ortofoto&_content_type=json&fast=index&from=1&to=30" -o q.json -w 'HTTP %{http_code}\n' || true
          head -c 3000 q.json; echo
          grep -oE 'https?://[^"\\ ]*(wms|WMS|wmts|geoserver|ows|MapServer)[^"\\ ]*' q.json | sort -u | head -40
      - name: WMS kandidati iz metapodataka + snimak pločice
        run: |
          set -u
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          mkdir -p istrazivanje
          cat md_*.xml q.json 2>/dev/null | grep -oE 'https?://[^"<> ]*(wms|WMS|wmts|WMTS|geoserver|ows|MapServer)[^"<> ]*' | sed 's/&amp;/\&/g' | sed -E 's/[?].*$//' | sort -u > kand.txt || true
          cat kand.txt
          while read -r u; do
            code=$(curl -sSL -m 40 -A "$UA" "$u?service=WMS&request=GetCapabilities" -o cap.xml -w '%{http_code}' || echo ERR)
            echo "---- $code $u ($(wc -c < cap.xml 2>/dev/null)B) CF=$(grep -c 'Just a moment' cap.xml 2>/dev/null)"
            if grep -q 'WMS_Capabilities\|WMT_MS_Capabilities' cap.xml 2>/dev/null; then
              n=$(echo "$u" | md5sum | cut -c1-8); cp cap.xml "istrazivanje/cap_$n.xml"; echo "$u" > "istrazivanje/cap_$n.url"
              grep -oE '<(Title|Name|Fees|AccessConstraints|CRS|SRS)>[^<]{0,200}' cap.xml | sort | uniq -c | sort -rn | head -40
              L=$(python3 - <<'PY'
          import re
          t=open('cap.xml',encoding='utf-8',errors='ignore').read()
          ns=re.findall(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>',t)
          c=[n for n in ns if re.search(r'orto|dof|ortho|2022',n,re.I)]
          print((c or ns or [''])[0])
          PY
          )
              echo "SLOJ: $L"
              # Bosanska Krupa, ~1,2 km x 1,2 km, EPSG:3857
              BB=1745000,5602000,1746200,5603200
              for v in 1.3.0 1.1.1; do
                k=CRS; [ $v = 1.1.1 ] && k=SRS
                curl -sSL -m 60 -A "$UA" "$u?service=WMS&version=$v&request=GetMap&layers=$L&styles=&$k=EPSG:3857&bbox=$BB&width=1024&height=1024&format=image/jpeg" -o "istrazivanje/krupa_${n}_$v.jpg" -w "GetMap $v %{http_code} %{content_type} %{size_download}B\n" || true
              done
              curl -sSI -m 30 -A "$UA" "$u?service=WMS&request=GetCapabilities" | grep -iE 'access-control|cache-control|server|cf-' || true
            fi
          done < kand.txt
      - name: Sačuvaj nalaze
        run: |
          mkdir -p istrazivanje
          cp md_*.xml q.json istrazivanje/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add istrazivanje && git commit -qm "probe: FGU ortofoto servisi" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin claude/practical-pasteur-p2npth && git push -q origin HEAD:claude/practical-pasteur-p2npth && break; sleep $((i*3)); done
