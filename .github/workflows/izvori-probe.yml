name: Izvori probe (Open-Meteo)

on:
  push:
    branches: [claude/practical-pasteur-p2npth]
    paths: ['.github/workflows/izvori-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tlo-potkornjak.js na stvarnom Open-Meteo
        run: node istrazivanje/tlo_test.mjs
