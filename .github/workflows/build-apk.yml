name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [codex-forest]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Pripremi verziju i assets
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 10109/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.1.9"/' android/app/build.gradle
          bash android/copy-assets.sh
      - name: Izgradi APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Provjeri APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOREST-UNA-SANA-v1.1.9
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.9
          name: FOREST-UNA-SANA v1.1.9
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
