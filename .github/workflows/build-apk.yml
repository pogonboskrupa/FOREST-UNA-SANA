name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [codex-forest, apk-build-v1]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java testovi (offline karte, bez Androida)
        run: |
          javac -encoding UTF-8 -d /tmp/jt android/app/src/main/java/ba/spd/usf/forest/SqliteTileMath.java android/test-java/SqliteTileMathTest.java
          java -ea -cp /tmp/jt ba.spd.usf.forest.SqliteTileMathTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Pripremi verziju i assets
        shell: bash
        run: |
          set -euo pipefail
          # APK_RELEASE_VERSION=1.4.20
          # UI/runtime oznaka i servisni keš se održavaju zasebno dok se
          # veliki index.html migrira u modularne skripte.
          WEB_VERSION="$(sed -n "s/^const APP_VER = 'v\([^']*\)';/\1/p" index.html)"
          APP_VERSION="$(sed -n 's/^[[:space:]]*# APK_RELEASE_VERSION=//p' .github/workflows/build-apk.yml)"
          test -n "$WEB_VERSION" && test -n "$APP_VERSION"
          IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          bash android/copy-assets.sh
          grep -q "versionName \"${APP_VERSION}\"" android/app/build.gradle
      - name: Izgradi APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Provjeri APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOREST-UNA-SANA-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: FOREST-UNA-SANA v${{ env.APP_VERSION }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
