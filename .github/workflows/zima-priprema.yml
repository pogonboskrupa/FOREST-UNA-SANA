name: Zimski snimak priprema

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-pasteur-p2npth]
    paths: ['.github/workflows/zima-priprema.yml', 'tools/zima_priprema.py']

permissions:
  contents: write

jobs:
  priprema:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PROBA: '1'
      PO_PLOCICI: '12'
    steps:
      - uses: actions/checkout@v4
      - name: GDAL
        run: sudo apt-get -qq update && sudo apt-get -qq install -y gdal-bin python3-gdal python3-numpy >/dev/null && gdalinfo --version && gdal2tiles.py --help | grep -i -A1 tiledriver || true
      - name: Sentinel-2 zimski mozaik za USK
        run: |
          set -eu
          rm -rf static/data/zima
          /usr/bin/python3 tools/zima_priprema.py static/data/usk_granica.geojson static/data/zima static/data/zima.json
      - name: Sačuvaj rezultat na granu
        if: env.PROBA != '1'
        run: |
          set -eu
          cat static/data/zima.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/zima static/data/zima.json
          git commit -q -m "data: zimski Sentinel-2 mozaik USK, pločice z8–14 (automatski)" || echo "nema promjena"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin ${GITHUB_REF_NAME} && git push -q origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((i * 5))
          done
